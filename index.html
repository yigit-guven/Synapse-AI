<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    
    <meta property="og:title" content="Synapse AI - Document Intelligence Engine">
    <meta property="og:description" content="High-performance, self-hosted RAG infrastructure for your documents.">
    <meta property="og:image" content="/socialbanner.png">
    <meta property="og:type" content="website">
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
</head>

<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo" style="display: flex; align-items: center; gap: 10px;">
                    <img src="/logo.svg" alt="Synapse AI Logo" style="height: 24px; width: auto;">
                    <span style="font-weight: 600; font-size: 1.1rem; color: var(--text);">Synapse AI</span>
                </div>
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                    <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>

            <div class="upload-section">
                <button id="upload-btn" class="primary-btn full-width">
                    + Upload PDF
                </button>
                <input type="file" id="file-input" hidden multiple accept=".pdf">

                <div style="margin-top: 10px;"></div>
                <button id="reset-btn" class="primary-btn full-width" style="background-color: #ef4444; color: white;">
                    🗑️ Reset DB
                </button>
            </div>

            <div class="divider"></div>

            <div class="section-label">Active Documents</div>
            <div class="file-list" id="file-list">
                <div class="empty-state">No files loaded.</div>
            </div>

            <div class="sidebar-footer"
                style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border);">
                <a href="privacy.html" target="_blank"
                    style="color: var(--text-muted); text-decoration: none; font-size: 0.8rem; display: flex; align-items: center; gap: 6px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="width: 14px; height: 14px;">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    Privacy Policy
                </a>
            </div>
        </aside>

        <main class="chat-area">
            <div class="chat-feed" id="chat-feed">
                <div class="start-screen">
                    <h1>Ready to analyze.</h1>
                    <p>Upload a document to begin. Data is processed locally.</p>
                </div>
            </div>

            <div class="input-container">
                <div class="input-box">
                    <textarea id="user-input" placeholder="Upload a document to unlock chat..." disabled rows="1"></textarea>
                    <button id="send-btn" class="send-icon" disabled>➜</button>
                </div>
            </div>
        </main>
    </div>

    <script src="index.js?v=streaming-fix-1.1"></script>
    <div id="toast-container"></div>
</body>

</html>
